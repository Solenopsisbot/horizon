[package]
name = "horizon-jvm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "Runs a Java mod on an embedded JVM against a generated Horizon facade (docs/java-mod-compat.md)"

[dependencies]
jni = { version = "0.21", features = ["invocation"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
